name: Release Mac app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_existing:
        description: Verify an already uploaded private candidate without rebuilding it
        type: boolean
        default: false
      tag:
        description: Existing candidate tag (verification only)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: draft-mac-release
  cancel-in-progress: false
env:
  DRAFT_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    if: ${{ !inputs.verify_existing }}
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Verify release version and signing configuration
        run: |
          test "$(uname -m)" = arm64
          test "$GITHUB_REF_NAME" = "v$(bun -p 'require("./package.json").version')"
          test "$DRAFT_RELEASE_TAG" = "$GITHUB_REF_NAME"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_SIGNING_IDENTITY"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: shasum -a 256 -c SHA256SUMS
      - name: Import distribution certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          certificate_path="$RUNNER_TEMP/draft-signing.p12"
          signing_keychain="$RUNNER_TEMP/draft-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 7200 "$signing_keychain"
          security import "$certificate_path" -k "$signing_keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$signing_keychain" > /dev/null
          security list-keychains -d user -s "$signing_keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$certificate_path"
          security find-identity -v -p codesigning "$signing_keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
      - run: bun run desktop:build --app-only
      - name: Notarize and staple app and installer
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          notary_key="$RUNNER_TEMP/draft-notary.p8"
          trap 'rm -f "$notary_key"' EXIT
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$notary_key"
          APPLE_API_KEY_PATH="$notary_key" bun run release:notarize
      - name: Sign authenticated update manifest
        env:
          DRAFT_UPDATE_SIGNING_KEY: ${{ secrets.DRAFT_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          update_key="$RUNNER_TEMP/draft-update-key.pem"
          trap 'rm -f "$update_key"' EXIT
          printf '%s' "$DRAFT_UPDATE_SIGNING_KEY" > "$update_key"
          DRAFT_UPDATE_SIGNING_KEY_PATH="$update_key" bun run release:prepare
      - name: Upload private draft release for clean-Mac verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun -e 'for (const note of await Bun.file("release-notes.json").json()) console.log("- " + note)' > "$RUNNER_TEMP/draft-release-notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
            gh release upload "$GITHUB_REF_NAME" release/Draft-* release/draft-update.json release/SHA256SUMS release/distribution-report.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/Draft-* release/draft-update.json release/SHA256SUMS release/distribution-report.json --title "Draft $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/draft-release-notes.md" --draft --prerelease
          fi
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/draft-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/draft-signing.p12" "$RUNNER_TEMP/draft-notary.p8" "$RUNNER_TEMP/draft-update-key.pem"

  clean-mac:
    needs: release
    if: ${{ always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.verify_existing)) }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      # GitHub only exposes unpublished draft releases to identities with push access.
      # The token is supplied solely to the download step, never the app or its tests.
      contents: write
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify candidate matches this source version
        run: test "$DRAFT_RELEASE_TAG" = "v$(bun -p 'require("./package.json").version')"
      - name: Require normal Gatekeeper enforcement on the clean Mac
        run: |
          sudo /usr/sbin/spctl --global-enable
          /usr/sbin/spctl --status | grep -F 'assessments enabled'
      - name: Download the exact release assets on a fresh Mac
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$DRAFT_RELEASE_TAG" --dir "$RUNNER_TEMP/draft-downloads" --pattern '*.dmg' --pattern '*macos-arm64.zip' --pattern 'draft-update.json'
      - name: Verify browser-style download, Gatekeeper, installation and first launch
        run: bun scripts/verify-download.ts "$RUNNER_TEMP/draft-downloads"

  publish:
    needs: clean-mac
    if: ${{ always() && needs.clean-mac.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Publish the tested release and refresh the website download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$DRAFT_RELEASE_TAG" --draft=false
          gh workflow run pages.yml --ref main
