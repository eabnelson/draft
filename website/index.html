<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff">
<meta name="description" content="Draft. Your writing. Your app. A local, open-source writing app you can change with your own AI.">
<meta property="og:title" content="Draft — your writing, your app"><meta property="og:description" content="Write. Make it yours. Update."><meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg"><title>Draft — your writing, your app</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202020;background:#fff;font-synthesis:none}*{box-sizing:border-box}body{margin:0;-webkit-font-smoothing:antialiased}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}a:hover,button:hover{color:#777}a:focus-visible,button:focus-visible{outline:2px solid #999;outline-offset:5px;border-radius:4px}.page{width:min(1180px,calc(100% - 64px));margin:auto}header{height:96px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:550;letter-spacing:-.5px}.brand img{width:33px;height:27px}.download{font-size:12px;background:#242424;border:1px solid #242424;border-radius:6px;color:#fff;padding:9px 13px}.download:hover{background:#444;color:#fff}h1{font-size:clamp(36px,5.6vw,64px);font-weight:450;letter-spacing:-.065em;line-height:1.1;margin:35px 0 38px}.yours{text-decoration:underline wavy #aaa;text-decoration-thickness:1.4px;text-underline-offset:10px}.demo-frame{border:1px solid #e4e4e4;border-radius:11px;overflow:hidden;box-shadow:0 6px 32px #00000004}.demo-bar{height:44px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 17px;gap:12px;background:#fcfcfc;color:#999;font-size:11px}.scene{color:#555;margin-right:10px}.demo-actions{display:flex;gap:16px;align-items:center}button{font:inherit;background:none;border:0;color:#666;cursor:pointer;padding:4px 0}iframe{display:block;width:100%;height:750px;border:0;background:#fff}.origin{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:30px 0 38px;color:#999;font-size:11px;line-height:1.8}.chain{display:flex;align-items:center;flex-wrap:wrap;gap:9px}.chain a{color:#777}.chain a:hover{text-decoration:underline;text-underline-offset:4px}.origin-note a{color:#777}.skip{position:absolute;top:-60px}.skip:focus{top:8px;background:#fff;padding:10px}.mobile-note{display:none}@media(max-width:650px){.page{width:calc(100% - 28px)}header{height:76px}h1{margin:31px 4px 30px;font-size:42px}.yours{text-underline-offset:8px;text-decoration-thickness:1px}.demo-bar{padding:0 12px;font-size:10px}.demo-actions{gap:12px}.demo-description{font-size:9px}iframe{height:720px}.origin{align-items:flex-start;flex-direction:column;gap:8px;margin:23px 3px 30px}.origin-note{font-size:10px}.brand{font-size:17px}.download{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body><a href="#main" class="skip">Skip to content</a><div class="page">
<header><a class="brand" href="./" aria-label="Draft home"><img src="assets/mark.svg" alt="" width="33" height="27">Draft</a><a class="download" href="https://github.com/eabnelson/draft/releases">Download for Mac ↗</a></header>
<main id="main"><h1>Your writing. <span class="yours">Your app.</span></h1>
<section class="demo-frame" aria-label="Interactive Draft demonstration">
<div class="demo-bar"><div><span class="scene" id="scene">Write</span><span class="demo-description">Live demo · updates sped up</span></div><div class="demo-actions"><button id="toggle" type="button" aria-label="Pause demo">Pause</button><button id="replay" type="button">Replay</button><button id="try" type="button">Try it ↗</button></div></div>
<iframe id="demo" src="demo/" title="Draft — interactive writing and feature update demo" sandbox="allow-scripts allow-same-origin allow-downloads allow-forms" referrerpolicy="no-referrer"></iframe>
</section></main>
<footer class="origin"><div class="chain"><span>From an idea by</span><a href="https://x.com/jasonfried/status/2105403067793584590">Jason Fried</a><span>→</span><a href="https://github.com/eabnelson/draft/blob/main/sources/transcript.md">Transcript</a><span>→</span><a href="https://github.com/eabnelson/draft/blob/main/docs/initial-product-spec.md">Spec</a><span>→</span><a href="https://github.com/eabnelson/draft">Code</a></div><div class="origin-note">Built with Codex · <a href="https://github.com/eabnelson/draft/blob/main/LICENSE">MIT</a></div></footer>
</div>
<script>
const frame=document.getElementById('demo'),toggle=document.getElementById('toggle'),scene=document.getElementById('scene');let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,ready=false;
function send(command){frame.contentWindow.postMessage({channel:'draft-demo',command},location.origin)}
function sync(){toggle.textContent=playing?'Pause':'Play';toggle.setAttribute('aria-label',playing?'Pause demo':'Play demo')}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.channel!=='draft-demo')return;const value=event.data;if(value.state==='ready'){ready=true;if(playing)send('play')}else{if(value.scene)scene.textContent=value.scene;if(value.state==='paused')playing=false;if(value.state==='playing')playing=true;sync()}});
toggle.onclick=()=>{playing=!playing;send(playing?'play':'pause');sync()};document.getElementById('replay').onclick=()=>{playing=true;send('replay');sync()};document.getElementById('try').onclick=()=>{playing=false;send('try');sync();frame.focus()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ready){playing=false;send('pause');sync()}});new IntersectionObserver(entries=>{if(!entries[0].isIntersecting&&ready&&playing){playing=false;send('pause');sync()}},{threshold:0}).observe(frame);sync();
</script>
</body></html>
