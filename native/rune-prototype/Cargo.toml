[package]
name = "draft-rune-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "draft-rune-prototype"
path = "src/main.rs"

[[bin]]
name = "draft"
path = "src/launcher.rs"

[dependencies]
rune = { path = "../vendor/rune", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend", "native-file-dialog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
pulldown-cmark = { version = "0.13", default-features = false }
# Rune disables Parley's default features. Opt into dictionary segmentation for CJK/Thai.
parley = { version = "0.12", default-features = false, features = ["std", "complex-scripts"] }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[profile.dev]
debug = 0

[profile.release]
debug = 0
